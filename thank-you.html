<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Thank You - Nsquare Enterprises</title>
  <meta http-equiv="refresh" content="8;url=index.html">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700|Open+Sans:400,600" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Open Sans", sans-serif;
      background: #f8faff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 60px 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .checkmark {
      width: 72px;
      height: 72px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 {
      font-family: "Roboto", sans-serif;
      font-size: 28px;
      color: #222;
      margin-bottom: 12px;
    }
    p {
      color: #666;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 10px;
    }
    .note {
      font-size: 13px;
      color: #aaa;
      margin-top: 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      background: #106eea;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.3s;
    }
    .btn:hover { background: #0b5cc8; }
    .whatsapp-link {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 32px;
      background: #25d366;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.3s;
    }
    .whatsapp-link:hover { background: #1ebe5d; }
  </style>
</head>

<body>
  <div class="card">
    <div class="checkmark">✅</div>
    <h1>Thank You!</h1>
    <p>Your enquiry has been received. Our team will get back to you shortly.</p>
    <p>For urgent queries, feel free to WhatsApp or call us directly.</p>
    <div>
      <a href="index.html" class="btn">Back to Home</a>
    </div>
    <div>
      <a href="https://wa.me/919067178282" class="whatsapp-link" target="_blank" rel="noopener noreferrer">💬 Chat on WhatsApp</a>
    </div>
    <p class="note">You will be redirected to the homepage in 8 seconds.</p>
  </div>
</body>

</html>
